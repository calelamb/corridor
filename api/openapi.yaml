openapi: 3.1.0
info:
  title: Corridor API
  version: 0.1.0
  description: Public foundation endpoints. Counts describe approved public records, not all collisions.
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: Health
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthEnvelope' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /readyz:
    get:
      operationId: Ready
      responses:
        '200':
          description: Dependencies are ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthEnvelope' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/coverage:
    get:
      operationId: Coverage
      responses:
        '200':
          description: Current publicly releasable data coverage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoverageEnvelope' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/sources:
    get:
      operationId: Sources
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, maximum: 100000, default: 0 }
      responses:
        '200':
          description: Ingested public source summaries; research candidates are not included
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourcesEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/segments:
    get:
      operationId: Segments
      summary: Road segments with predicted risk and percentiles
      description: Returns 0.1-mile road segment linestrings with risk scores and percentile rankings.
      parameters:
        - name: bbox
          in: query
          description: Bounding box filter as west,south,east,north (minLon,minLat,maxLon,maxLat)
          schema:
            type: string
        - name: min_risk
          in: query
          description: Minimum risk score threshold
          schema:
            type: number
            format: double
            minimum: 0
      responses:
        '200':
          description: Road segment linestrings with risk scores and percentile rankings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SegmentsEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/segments/{id}:
    get:
      operationId: SegmentDetail
      summary: Road segment risk detail, monthly profile, and SHAP drivers
      description: Returns monthly risk profile, species probability breakdown, and plain-language TreeSHAP drivers for a 0.1-mile segment.
      parameters:
        - name: id
          in: path
          required: true
          description: Road segment identifier
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Road segment risk detail with SHAP attribution
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SegmentDetailEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/hotspots:
    get:
      operationId: Hotspots
      summary: Statistical wildlife collision hotspots along road network
      description: Returns hotspot scores and statistical significance per road segment using network-constrained algorithms.
      parameters:
        - name: method
          in: query
          description: Hotspot method (nkde, getis_ord, density)
          schema:
            type: string
            enum: [nkde, getis_ord, density]
            default: nkde
        - name: bandwidth
          in: query
          description: Search bandwidth in meters along road network (for NKDE)
          schema:
            type: number
            format: double
            minimum: 10
            default: 500
        - name: bbox
          in: query
          description: Bounding box filter as west,south,east,north
          schema:
            type: string
      responses:
        '200':
          description: Hotspot segment scores and significance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HotspotsEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/mitigation:
    get:
      operationId: Mitigation
      summary: Wildlife mitigation candidate project sites ranked by benefit-cost ratio
      description: Returns continuous mitigation project sites generated by clustering high-risk road segments (>90th percentile), ranked by benefit-cost ratio within an optional budget limit.
      parameters:
        - name: budget
          in: query
          description: Total available funding budget in USD for knapsack/greedy optimization
          schema:
            type: number
            format: double
            minimum: 0
        - name: min_bcr
          in: query
          description: Minimum Benefit-Cost Ratio threshold
          schema:
            type: number
            format: double
            minimum: 0
        - name: state
          in: query
          description: Two-letter state postal code filter (e.g. WY)
          schema:
            type: string
            maxLength: 2
      responses:
        '200':
          description: Ranked mitigation candidate sites within budget
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MitigationEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/mitigation/{id}/brief.pdf:
    get:
      operationId: MitigationBriefPDF
      summary: FHWA WCPP funding-ready PDF brief for a mitigation candidate site
      description: Generates a 2-page publication-grade PDF project funding brief with benefit-cost analysis, engineering estimates, map snapshot, and citations.
      parameters:
        - name: id
          in: path
          required: true
          description: Mitigation candidate site identifier
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Binary PDF funding brief
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/reports:
    post:
      operationId: CreateReport
      summary: Submit field carcass observation report
      description: Records carcass observations submitted by park rangers in the field. Accepts client-generated UUID for offline idempotency, snaps GPS coordinates to the nearest 0.1-mile road segment (50m tolerance), and deduplicates against recent nearby carcass reports (200m / 72h).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReportRequest' }
      responses:
        '201':
          description: Field report successfully created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportEnvelope' }
        '200':
          description: Idempotent submission already recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/reports/{id}/photo:
    post:
      operationId: UploadReportPhoto
      summary: Upload carcass observation photo
      description: Accepts field photo uploads, strips EXIF GPS tags before private storage, stores raw image bytes in private object storage, executes species classification inference, and returns top suggestion chips.
      parameters:
        - name: id
          in: path
          required: true
          description: Field report identifier
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          multipart/form-data:
            schema:
              type: object
              properties:
                photo:
                  type: string
                  format: binary
      responses:
        '200':
          description: Photo uploaded and species suggestions generated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhotoUploadEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/stream/reports:
    get:
      operationId: StreamReports
      summary: Real-time SSE stream of incoming carcass reports
      description: Server-Sent Events stream delivering real-time carcass observation reports to dispatch stations and ranger desks.
      responses:
        '200':
          description: Real-time incident event stream
          content:
            text/event-stream:
              schema:
                type: string
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unavailable:
      description: Dependencies unavailable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RateLimited:
      description: Request limit exceeded
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    HealthData:
      type: object
      additionalProperties: false
      required: [available]
      properties:
        available: { type: boolean }
    CoverageData:
      type: object
      additionalProperties: false
      required: [state, ingested_events, model_available]
      properties:
        state: { type: string, enum: [empty, unmodeled] }
        ingested_events: { type: integer, format: int64, minimum: 0 }
        model_available: { type: boolean, enum: [false] }
    SourceSummary:
      type: object
      additionalProperties: false
      required: [id, name, url, license, status]
      properties:
        id: { type: string }
        name: { type: string }
        url: { type: string, format: uri }
        license: { type: string }
        status: { type: string }
    Page:
      type: object
      additionalProperties: false
      required: [total, limit, offset]
      properties:
        total: { type: integer, format: int64, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        offset: { type: integer, minimum: 0 }
    HealthEnvelope:
      type: object
      additionalProperties: false
      required: [status, data, error, meta]
      properties:
        status: { type: string, enum: [success] }
        data: { $ref: '#/components/schemas/HealthData' }
        error: { type: 'null' }
        meta: { type: 'null' }
    CoverageEnvelope:
      type: object
      additionalProperties: false
      required: [status, data, error, meta]
      properties:
        status: { type: string, enum: [success] }
        data: { $ref: '#/components/schemas/CoverageData' }
        error: { type: 'null' }
        meta: { type: 'null' }
    SourcesEnvelope:
      type: object
      additionalProperties: false
      required: [status, data, error, meta]
      properties:
        status: { type: string, enum: [success] }
        data:
          type: array
          items: { $ref: '#/components/schemas/SourceSummary' }
        error: { type: 'null' }
        meta: { $ref: '#/components/schemas/Page' }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [status, data, error, meta]
      properties:
        status: { type: string, enum: [error] }
        data: { type: 'null' }
        error: { type: string }
        meta: { type: 'null' }
    LineStringGeometry:
      type: object
      additionalProperties: false
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [LineString]
        coordinates:
          type: array
          items:
            type: array
            items:
              type: number
              format: double
            minItems: 2
    ShapDriver:
      type: object
      additionalProperties: false
      required: [feature, impact, weight]
      properties:
        feature: { type: string }
        impact: { type: string }
        weight: { type: number, format: double }
    SegmentSummary:
      type: object
      additionalProperties: false
      required: [id, geometry, risk_score, percentile_rank, p10, p90]
      properties:
        id: { type: string, format: uuid }
        geometry: { $ref: '#/components/schemas/LineStringGeometry' }
        risk_score: { type: number, format: double }
        percentile_rank: { type: number, format: double }
        p10: { type: number, format: double }
        p90: { type: number, format: double }
        highway_ref: { type: string }
        state: { type: string }
    SegmentDetail:
      type: object
      additionalProperties: false
      required: [id, geometry, risk_score, percentile_rank, p10, p90, monthly_profile, species_breakdown, shap_drivers]
      properties:
        id: { type: string, format: uuid }
        geometry: { $ref: '#/components/schemas/LineStringGeometry' }
        risk_score: { type: number, format: double }
        percentile_rank: { type: number, format: double }
        p10: { type: number, format: double }
        p90: { type: number, format: double }
        highway_ref: { type: string }
        state: { type: string }
        monthly_profile:
          type: object
          additionalProperties:
            type: number
            format: double
        species_breakdown:
          type: object
          additionalProperties:
            type: number
            format: double
        shap_drivers:
          type: array
          items: { $ref: '#/components/schemas/ShapDriver' }
    SegmentsEnvelope:
      type: object
      additionalProperties: false
      required: [status, data, error, meta]
      properties:
        status: { type: string, enum: [success] }
        data:
          type: array
          items: { $ref: '#/components/schemas/SegmentSummary' }
        error: { type: 'null' }
        meta: { type: 'null' }
    SegmentDetailEnvelope:
      type: object
      additionalProperties: false
      required: [status, data, error, meta]
      properties:
        status: { type: string, enum: [success] }
        data: { $ref: '#/components/schemas/SegmentDetail' }
        error: { type: 'null' }
        meta: { type: 'null' }
    HotspotItem:
      type: object
      additionalProperties: false
      required: [segment_id, score]
      properties:
        segment_id: { type: string }
        score: { type: number, format: double }
        raw_count: { type: integer }
        z_score: { type: number, format: double }
        p_value: { type: number, format: double }
        fdr_p_value: { type: number, format: double }
        significance: { type: string }
    HotspotsEnvelope:
      type: object
      additionalProperties: false
      required: [status, data, error, meta]
      properties:
        status: { type: string, enum: [success] }
        data:
          type: array
          items: { $ref: '#/components/schemas/HotspotItem' }
        error: { type: 'null' }
        meta: { type: 'null' }
    CandidateSite:
      type: object
      additionalProperties: false
      required:
        - id
        - segments
        - state
        - highway_ref
        - milepost_start
        - milepost_end
        - length_m
        - recommended_type
        - est_cost_usd
        - expected_avoided_collisions
        - expected_savings_usd
        - bcr
        - p10_bcr
        - p90_bcr
        - rationale
      properties:
        id:
          type: string
          format: uuid
        segments:
          type: array
          items:
            type: string
            format: uuid
        state:
          type: string
        highway_ref:
          type: string
        milepost_start:
          type: number
          format: double
        milepost_end:
          type: number
          format: double
        length_m:
          type: number
          format: double
        recommended_type:
          type: string
        est_cost_usd:
          type: number
          format: double
        expected_avoided_collisions:
          type: number
          format: double
        expected_savings_usd:
          type: number
          format: double
        bcr:
          type: number
          format: double
        p10_bcr:
          type: number
          format: double
        p90_bcr:
          type: number
          format: double
        rationale:
          type: string
    MitigationEnvelope:
      type: object
      additionalProperties: false
      required: [status, data, error, meta]
      properties:
        status: { type: string, enum: [success] }
        data:
          type: array
          items: { $ref: '#/components/schemas/CandidateSite' }
        error: { type: 'null' }
        meta: { type: 'null' }
    CreateReportRequest:
      type: object
      additionalProperties: false
      required:
        - id
        - species_common_name
        - latitude
        - longitude
        - observed_at
      properties:
        id:
          type: string
          format: uuid
        species_common_name:
          type: string
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        observed_at:
          type: string
          format: date-time
        confidence:
          type: string
        notes:
          type: string
    SpeciesSuggestion:
      type: object
      additionalProperties: false
      required:
        - species
        - confidence
      properties:
        species:
          type: string
        confidence:
          type: number
          format: double
    FieldReport:
      type: object
      additionalProperties: false
      required:
        - id
        - species_common_name
        - latitude
        - longitude
        - is_duplicate
        - observed_at
        - confidence
        - created_at
      properties:
        id:
          type: string
          format: uuid
        species_common_name:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        snapped_latitude:
          type: number
          format: double
        snapped_longitude:
          type: number
          format: double
        segment_id:
          type: string
          format: uuid
        snap_distance_m:
          type: number
          format: double
        dedup_group_id:
          type: string
          format: uuid
        is_duplicate:
          type: boolean
        observed_at:
          type: string
          format: date-time
        confidence:
          type: string
        notes:
          type: string
        photo_key:
          type: string
        species_suggestions:
          type: array
          items:
            $ref: '#/components/schemas/SpeciesSuggestion'
        created_at:
          type: string
          format: date-time
    ReportEnvelope:
      type: object
      additionalProperties: false
      required: [status, data, error, meta]
      properties:
        status: { type: string, enum: [success] }
        data: { $ref: '#/components/schemas/FieldReport' }
        error: { type: 'null' }
        meta: { type: 'null' }
    PhotoUploadData:
      type: object
      additionalProperties: false
      required:
        - report_id
        - photo_key
        - species_suggestions
      properties:
        report_id:
          type: string
          format: uuid
        photo_key:
          type: string
        species_suggestions:
          type: array
          items:
            $ref: '#/components/schemas/SpeciesSuggestion'
    PhotoUploadEnvelope:
      type: object
      additionalProperties: false
      required: [status, data, error, meta]
      properties:
        status: { type: string, enum: [success] }
        data: { $ref: '#/components/schemas/PhotoUploadData' }
        error: { type: 'null' }
        meta: { type: 'null' }




