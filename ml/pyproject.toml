[project]
name = "corridor-ml"
version = "0.1.0"
description = "Corridor wildlife-vehicle collision ML pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.2.0",
    "lightgbm>=4.7.0",
    "numpy>=2.5.4",
    "onnx>=1.23.2",
    "pandas>=3.0.6",
    "pytest>=9.1.1",
    "rasterio>=1.5.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "shap>=0.53.0",
    "shapely>=2.2.0",
    "statsmodels>=0.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["corridor_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

