name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-tests:
    name: Go Tests & Pure Compilation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go 1.23+
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js 20+ (for embedded web assets)
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web assets for Go embedding
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Run pure Go test suite
        run: |
          CGO_ENABLED=0 go test -v -race=false ./internal/api ./internal/auth ./internal/export ./internal/hotspot ./internal/model ./internal/prioritize ./internal/route ./internal/server ./internal/storage ./internal/web ./tests

      - name: Validate pure Go compilation
        run: |
          CGO_ENABLED=0 go build -o /dev/null ./cmd/corridorctl ./cmd/corridor

  web-checks:
    name: Web Checks (Lint, Typecheck, Unit Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20+
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: SvelteKit typecheck (svelte-check)
        working-directory: web
        run: npm run check

      - name: Lint (Prettier & ESLint)
        working-directory: web
        run: npm run lint

      - name: Vitest unit tests
        working-directory: web
        run: npm run test:unit -- --run

  e2e-tests:
    name: E2E & WCAG 2.2 AA Accessibility Audits (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20+
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright browsers & dependencies
        working-directory: web
        run: npx playwright install --with-deps

      - name: Run Playwright tests (Chromium, Firefox, WebKit, WCAG 2.2 AA)
        working-directory: web
        run: npx playwright test

      - name: Upload Playwright test artifacts
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-test-results
          path: |
            web/test-results/
            web/playwright-report/
          retention-days: 14
